<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مزرعتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/static/css/style.css">
<script src="/static/js/i18n.js"></script>
<script src="/static/js/app.js" defer></script>
</head>
<body>
<nav class="navbar">
  <a class="brand" href="/home"><span class="mark" aria-hidden="true">🌾</span><span data-i18n="brand_name">مزرعتي</span></a>
  <div class="nav-links">
    <a href="/home" class="{{ 'active' if active == 'home' }}" {{ 'aria-current=page' if active == 'home' }}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="nav_home">الرئيسية</span></a>
    <a href="/products" class="{{ 'active' if active == 'products' }}" {{ 'aria-current=page' if active == 'products' }}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><span data-i18n="nav_products">منتجاتي</span></a>
    <a href="/sources" class="{{ 'active' if active == 'sources' }}" {{ 'aria-current=page' if active == 'sources' }}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-i18n="nav_sources">مصادري</span></a>
  </div>
  <div class="nav-end">
    <span class="nav-user">{{ username }}</span>
    <button id="langBtn" class="nav-lang" type="button">English</button>
    <a href="/logout" data-i18n="logout">تسجيل خروج</a>
  </div>
</nav>

<main class="wrap">
{% block content %}{% endblock %}
</main>

{% include "_footer.html" %}
</body>
</html>
