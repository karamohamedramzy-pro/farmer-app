{% extends "auth_base.html" %}
{% block body %}
  <h2 data-i18n="reg_title">إنشاء حساب</h2>
  {% if error %}<p class="err" data-i18n="{{ error }}"></p>{% endif %}
  <form method="post" action="/register">
    <label for="name" data-i18n="lbl_name">الاسم الكامل</label>
    <input id="name" name="name" value="{{ form.name or '' }}" maxlength="100" autocomplete="name" required>
    <label for="email" data-i18n="email">البريد الإلكتروني</label>
    <input id="email" name="email" type="email" value="{{ form.email or '' }}" maxlength="254" autocomplete="email" dir="ltr" required>
    <label for="phone" data-i18n="lbl_phone">رقم واتساب</label>
    <input id="phone" name="phone" type="tel" value="{{ form.phone or '' }}" maxlength="20" autocomplete="tel" dir="ltr" placeholder="+9665xxxxxxxx" required>
    <p class="hint" data-i18n="phone_hint"></p>
    <label for="password" data-i18n="lbl_pass">كلمة السر</label>
    <input id="password" name="password" type="password" minlength="6" maxlength="200" autocomplete="new-password" required>
    <button class="btn-block" data-i18n="reg_btn">إنشاء الحساب</button>
  </form>
  <a class="btn btn-outline btn-block" href="/" data-i18n="back_login">لدي حساب — تسجيل الدخول</a>
{% endblock %}
