<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مزرعتي</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="/static/js/i18n.js"></script>
</head>
<body>
<button id="langBtn" class="lang-btn" type="button">English</button>

<div class="box">
  <h1 data-i18n="app_name">🌾 مزرعتي</h1>
  {% if error %}<p class="err" data-i18n="{{ error }}"></p>{% endif %}
  <form method="post" action="/login">
    <input name="username" data-i18n-placeholder="username" placeholder="الاسم" required>
    <input name="password" type="password" data-i18n-placeholder="password" placeholder="كلمة السر" required>
    <button data-i18n="login">دخول</button>
  </form>

  <div class="guide">
    <h3 data-i18n="guide_title">📖 كيف تستعمل الموقع؟</h3>
    <ol>
      <li data-i18n="g1"></li>
      <li data-i18n="g2"></li>
      <li data-i18n="g3"></li>
      <li data-i18n="g4"></li>
      <li data-i18n="g5"></li>
    </ol>
    <p data-i18n="g_example"></p>
  </div>
</div>
</body>
</html>
